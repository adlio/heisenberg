[package]
name = "axum-sveltekit"
version = "0.1.0"
edition = "2021"

# Opt out of parent workspace (examples are standalone projects)
[workspace]

[dependencies]
heisenberg = { path = "../..", features = ["axum"] }
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
rust-embed = "8.0"
