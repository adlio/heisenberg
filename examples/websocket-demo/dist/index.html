<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Demo</title>
    <style>
        body { font-family: system-ui; max-width: 600px; margin: 50px auto; padding: 20px; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin: 20px 0; }
        .message { margin: 5px 0; padding: 5px; border-radius: 3px; }
        .sent { background: #e3f2fd; }
        .received { background: #f1f8e9; }
        input { width: 70%; padding: 8px; }
        button { padding: 8px 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background: #c8e6c9; }
        .disconnected { background: #ffcdd2; }
    </style>
</head>
<body>
    <h1>🔌 WebSocket Proxying Demo</h1>
    <div id="status" class="status disconnected">Disconnected</div>
    <div id="messages"></div>
    <input id="input" type="text" placeholder="Type a message..." />
    <button onclick="send()">Send</button>

    <script>
        const ws = new WebSocket('ws://' + location.host + '/ws');
        const messages = document.getElementById('messages');
        const status = document.getElementById('status');
        const input = document.getElementById('input');

        ws.onopen = () => {
            status.textContent = 'Connected ✓';
            status.className = 'status connected';
        };

        ws.onclose = () => {
            status.textContent = 'Disconnected ✗';
            status.className = 'status disconnected';
        };

        ws.onmessage = (event) => {
            const div = document.createElement('div');
            div.className = 'message received';
            div.textContent = '← ' + event.data;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        };

        function send() {
            const msg = input.value;
            if (msg && ws.readyState === WebSocket.OPEN) {
                ws.send(msg);
                const div = document.createElement('div');
                div.className = 'message sent';
                div.textContent = '→ ' + msg;
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                input.value = '';
            }
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
