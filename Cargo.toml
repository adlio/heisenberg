[workspace]
members = [
    "cargo-heisenberg",
    "heisenberg-macros",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.70"
authors = ["Aaron Longwell <a@adl.io>"]
license = "MIT"
repository = "https://github.com/adlio/heisenberg"
homepage = "https://github.com/adlio/heisenberg"

[package]
name = "heisenberg"
description = "Framework-agnostic dual-mode web serving for Rust applications. Seamlessly switch between proxy mode (forwarding to frontend dev servers) and embed mode (serving embedded static assets)."
documentation = "https://docs.rs/heisenberg"
readme = "README.md"
keywords = ["web", "spa", "proxy", "embed", "axum"]
categories = ["web-programming", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["axum"]
axum = ["dep:axum"]
logging = ["dep:tracing"]
actix = ["dep:actix-web"]
rocket = ["dep:rocket"]

[dependencies]
# Core dependencies
heisenberg-macros = { path = "heisenberg-macros", version = "0.4.0" }
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-layer = "0.3"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.11", features = ["json"] }
rust-embed = "8.0"
once_cell = "1.19"
ctor = "0.2"
paste = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tracing = { version = "0.1", optional = true }
tokio-tungstenite = "0.21"
futures-util = "0.3"
sha1 = "0.10"
base64 = "0.21"

# Optional framework dependencies
axum = { version = "0.7", optional = true }
actix-web = { version = "4.0", optional = true }
rocket = { version = "0.5", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tower-test = "0.4"
tempfile = "3.0"
assert_matches = "1.5"
httpmock = "0.7"
criterion = { version = "0.5", features = ["html_reports"] }
axum = "0.7"
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
serial_test = "3.0"
