[package]
name = "cargo-heisenberg"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
authors = ["Aaron <aaron@example.com>"]
license = "MIT"
description = "Cargo plugin for Heisenberg - orchestrates frontend builds and dev servers"
repository = "https://github.com/username/heisenberg"
homepage = "https://github.com/username/heisenberg"
keywords = ["cargo", "plugin", "web", "spa", "frontend"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "cargo-heisenberg"
path = "src/main.rs"

[dependencies]
heisenberg = { path = "../heisenberg" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
ratatui = "0.26"
crossterm = "0.27"
