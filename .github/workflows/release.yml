name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        run: |
          notes=$(awk '/^## \[${{ steps.version.outputs.version }}\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md)
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
            echo "Release $GITHUB_REF_NAME already exists, updating..."
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "${{ steps.changelog.outputs.notes }}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "${{ steps.changelog.outputs.notes }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish crates to crates.io
        run: |
          # Publish in dependency order:
          #   heisenberg-macros (no internal deps)
          #   heisenberg        (depends on heisenberg-macros)
          #   cargo-heisenberg  (depends on heisenberg)
          #
          # We tolerate the case where a crate version was already published
          # (e.g. a previous run got partway through and we're re-running),
          # but any other failure aborts the job loudly.
          set -euo pipefail
          crates=(heisenberg-macros heisenberg cargo-heisenberg)
          for crate in "${crates[@]}"; do
            echo "::group::Publishing $crate"
            if output=$(cargo publish -p "$crate" 2>&1); then
              echo "$output"
              echo "Published $crate"
            elif echo "$output" | grep -qiE "already (uploaded|exists)"; then
              echo "$output"
              echo "$crate already published at this version, skipping"
            else
              echo "$output" >&2
              echo "::error::Failed to publish $crate"
              exit 1
            fi
            echo "::endgroup::"
            echo "Waiting for crates.io index to update..."
            sleep 30
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
